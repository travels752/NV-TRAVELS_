
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NV TRAVELSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <header class="top">
      <div class="logo">✈️ NV <span>TRAVELSS</span></div>
      <p>आपका सफर, हमारी ज़िम्मेदारी ❤️</p>
      <div class="tagline">TRAVEL • RIDE • HOTEL • TICKETS</div>
    </header>

    <section class="hero">
      <div class="hero-content">
        <span class="eyebrow">EXPLORE THE WORLD</span>
        <h1>आपका अगला सफर<br>यहाँ से शुरू होता है!</h1>
        <p>Travel more. Worry less.</p>
        <div class="plane">✈</div>
      </div>
    </section>

    <section class="services">
      <h2>कहाँ जाना चाहते हैं?</h2>
      <p class="subtitle">अपनी पसंद की सर्विस चुनें</p>

      <div class="service-grid">
        <button class="service ride" onclick="choose('Ride')">
          <span class="emoji">🚕</span>
          <strong>Ride</strong>
          <small>Book your ride</small>
        </button>

        <button class="service hotel" onclick="choose('Hotel')">
          <span class="emoji">🏨</span>
          <strong>Hotel</strong>
          <small>Stay comfortably</small>
        </button>

        <button class="service bus" onclick="choose('Bus Tickets')">
          <span class="emoji">🚌</span>
          <strong>Bus Tickets</strong>
          <small>Book bus seats</small>
        </button>

        <button class="service train" onclick="choose('Train Tickets')">
          <span class="emoji">🚆</span>
          <strong>Train Tickets</strong>
          <small>Plan your journey</small>
        </button>

        <button class="service flight" onclick="choose('Flight Tickets')">
          <span class="emoji">✈️</span>
          <strong>Flight Tickets</strong>
          <small>Fly anywhere</small>
        </button>

        <button class="service packages" onclick="choose('Packages')">
          <span class="emoji">🏔️</span>
          <strong>Packages</strong>
          <small>Explore destinations</small>
        </button>

        <button class="service reels" onclick="choose('Reels')">
          <span class="emoji">▶️</span>
          <strong>Travel Reels</strong>
          <small>Watch & share</small>
        </button>

        <button class="service more" onclick="choose('More Services')">
          <span class="emoji">✨</span>
          <strong>More</strong>
          <small>Explore more</small>
        </button>
      </div>
    </section>

    <footer class="bottom">
      <button onclick="choose('Home')">🏠<small>Home</small></button>
      <button onclick="choose('Reels')">🎬<small>Reels</small></button>
      <button onclick="choose('Search')">🔎<small>Search</small></button>
      <button onclick="choose('Profile')">👤<small>Profile</small></button>
    </footer>

  </main>
  <script src="script.js"></script>
</body>
</html>
