
<!-- OTHER CONTENT PAGE -->

 <header>
  <button class="icon-btn" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i></button>
  <div class="logo" id="contentTitle">NV TRAVELSS</div>
  <button class="icon-btn" onclick="showProfile()"><i class="fa-solid fa-user"></i></button>
 </header>
 <main>
  <div id="contentIntro" class="content-card"></div>
  <div id="contentList"></div>
 </main>
</section>

<!-- REELS PAGE -->
<section id="reelsPage" class="page">
 <header>
  <button class="icon-btn" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i></button>
  <div class="logo">NV <span>REELS</span></div>
  <button class="icon-btn" onclick="showProfile()"><i class="fa-solid fa-user"></i></button>
 </header>
 <main>
  <div class="content-card">
   <h3>Latest Reels</h3>
   <p>अपनी पसंदीदा जगहों के वीडियो देखें और शेयर करें।</p>
  </div>

 </main>
</section>

<!-- PROFILE PAGE -->
<section id="profilePage" class="page">
 <header>
  <button class="icon-btn" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i></button>
  <div class="logo">MY PROFILE</div>
 </header>
 <main>
  <div id="profileDetails" class="content-card"></div>
  <button class="logout" onclick="logout()">LOG OUT</button>
 </main>
</section>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="outsideClose(event)">
 <div class="modal">
  <div class="modal-head">
   <h2 id="modalTitle">Details</h2>
   <button class="close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div id="modalBody"></div>
 </div>
</div>

<div class="bottom-nav" id="bottomNav">
 <button class="nav-item active" onclick="goHome()"><i class="fa-solid fa-house"></i>Home</button>
 <button class="nav-item" onclick="showReels()"><i class="fa-solid fa-circle-play"></i>Reels</button>
 <button class="nav-item" onclick="createPost()"><i class="fa-solid fa-plus post-icon"></i>Post</button>
 <button class="nav-item" onclick="showSearch()"><i class="fa-solid fa-magnifying-glass"></i>Search</button>
 <button class="nav-item" onclick="showProfile()"><i class="fa-solid fa-user"></i>Profile</button>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* NV TRAVELSS APP */
const $ = id => document.getElementById(id);
const STORE_USER = "nv_travelss_user";
const STORE_BOOKINGS = "nv_travelss_bookings";
const STORE_LIKES = "nv_travelss_likes";

let currentRole = "";
let currentUser = JSON.parse(localStorage.getItem(STORE_USER) || "null");
let selectedVehicle = "Sedan";
let activeTicketType = "bus";
let currentContentType = "";
let toastTimer;

const vehicles = [
 {name:"Bike",rate:10,img:"https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=600"},
 {name:"Auto",rate:15,img:"https://images.unsplash.com/photo-1601924928377-4e9b8e7b4c2b?w=600"},
 {name:"Hatchback",rate:16,img:"https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=600"},
 {name:"Sedan",rate:18,img:"https://images.unsplash.com/photo-1590362891991-f776e747a588?w=600"},
 {name:"SUV",rate:22,img:"https://images.unsplash.com/photo-1519641471654-76ce0107ad1b?w=600"},
 {name:"MUV",rate:24,img:"https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=600"},
 {name:"Premium",rate:30,img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600"},
 {name:"6–7 Seater",rate:25,img:"https://images.unsplash.com/photo-1563720223185-11003d516935?w=600"},
 {name:"8–12 Seater",rate:30,img:"https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=600"},
 {name:"Tempo Traveller",rate:35,img:"https://images.unsplash.com/photo-1570125909232-eb263c188f7e?w=600"},
 {name:"Mini Bus",rate:45,img:"https://images.unsplash.com/photo-1570125909232-eb263c188f7e?w=600"},
 {name:"Bus",rate:60,img:"https://images.unsplash.com/photo-1570125909232-eb263c188f7e?w=600"}
];

const listings = {
 hotel:[
  {name:"Sayaji Hotel Indore",place:"Vijay Nagar, Indore",desc:"प्रीमियम होटल, आरामदायक कमरे और शानदार सुविधाएँ।",img:"https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800",price:"कीमत होटल से पूछें"},
  {name:"Radisson Blu Hotel Indore",place:"Vijay Nagar, Indore",desc:"लक्जरी स्टे और शानदार सुविधाएँ।",img:"https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=800",price:"कीमत होटल से पूछें"},
  {name:"Indore Hotel Stay",place:"Indore, Madhya Pradesh",desc:"परिवार और यात्रियों के लिए होटल विकल्प।",img:"https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?w=800",price:"कीमत होटल से पूछें"}
 ],
 bus:[
  {name:"Indore to Bhopal Bus",place:"Indore → Bhopal",desc:"अपनी यात्रा के लिए बस और सीट चुनें।",img:"https://images.unsplash.com/photo-1570125909232-eb263c188f7e?w=800",price:"किराया उपलब्धता के अनुसार"},
  {name:"Indore to Ujjain Bus",place:"Indore → Ujjain",desc:"बस की उपलब्धता और सीट की जानकारी देखें।",img:"https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=800",price:"किराया उपलब्धता के अनुसार"}
 ],
 train:[
  {name:"Indore Railway Services",place:"Indore Junction",desc:"ट्रेन का समय और सीट उपलब्धता देखकर टिकट बुक करें।",img:"https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=800",price:"किराया रेलवे के अनुसार"},
  {name:"Indore to Bhopal Train",place:"Indore → Bhopal",desc:"यात्रा की तारीख चुनकर ट्रेन खोजें।",img:"https://images.unsplash.com/photo-1532105956626-9569c03602f6?w=800",price:"किराया रेलवे के अनुसार"}
 ],
 flight:[
  {name:"Flights from Indore",place:"Devi Ahilya Bai Holkar Airport",desc:"अपनी यात्रा की तारीख के अनुसार फ्लाइट खोजें।",img:"https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=800",price:"किराया उपलब्धता के अनुसार"},
  {name:"Indore to Delhi Flights",place:"Indore → Delhi",desc:"फ्लाइट का समय और किराया देखें।",img:"https://images.unsplash.com/photo-1529070538774-1843cb3265df?w=800",price:"किराया उपलब्धता के अनुसार"}
 ],
 package:[
  {name:"Manali Tour Package",place:"Manali, Himachal Pradesh",desc:"पहाड़, बर्फ और खूबसूरत वादियों की यात्रा।",img:"https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?w=800",price:"कीमत जानकारी के लिए संपर्क करें"},
  {name:"Kashmir Tour Package",place:"Kashmir",desc:"झीलें, पहाड़ और प्राकृतिक खूबसूरती।",img:"https://images.unsplash.com/photo-1595815771614-ade9d652a65d?w=800",price:"कीमत जानकारी के लिए संपर्क करें"},
  {name:"Goa Tour Package",place:"Goa",desc:"समुद्र तट और शानदार छुट्टियाँ।",img:"https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?w=800",price:"कीमत जानकारी के लिए संपर्क करें"}
 ]
};

function safe(value){
 return String(value ?? "").replace(/[&<>"']/g, c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function showPage(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 const page=$(id);
 if(page) page.classList.add("active");
 const nav=$("bottomNav");
 if(nav) nav.style.display=(id==="customerPage" || id==="reelsPage")?"flex":"none";
 window.scrollTo(0,0);
}

function notify(message){
 const t=$("toast");
 t.textContent=message;
 t.style.display="block";
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>t.style.display="none",2400);
}

function chooseRole(role){
 currentRole=role;
 $("loginTitle").textContent=role==="customer"?"Customer Login":"Service Provider Login";
 $("loginSubtitle").textContent=role==="customer"?"अपनी जानकारी भरकर आगे बढ़ें":"Driver या Hotel Owner की जानकारी भरें";
 $("providerTypeField").style.display=role==="provider"?"block":"none";
 showPage("loginPage");
}

function loginUser(){
 const name=$("loginName").value.trim();
 const phone=$("loginPhone").value.trim();
 if(name.length<2) return notify("अपना पूरा नाम लिखें");
 if(!/^[6-9]\d{9}$/.test(phone)) return notify("सही 10 अंकों का मोबाइल नंबर लिखें");

 const user={
  name,phone,role:currentRole,
  service:currentRole==="provider"?$("providerType").value:"Customer"
 };
 localStorage.setItem(STORE_USER,JSON.stringify(user));
 currentUser=user;
 openUserHome();
}

function openUserHome(){
 if(!currentUser) return showPage("rolePage");
 if(currentUser.role==="provider"){
  $("providerWelcome").textContent="Welcome, "+currentUser.name;
  showPage("providerPage");
 }else{
  showPage("customerPage");
 }
}

function logout(){
 localStorage.removeItem(STORE_USER);
 currentUser=null;
 currentRole="";
 $("loginName").value="";
 $("loginPhone").value="";
 showPage("rolePage");
}

function goHome(){
 if(currentUser) openUserHome();
 else showPage("rolePage");
}

function getBookings(){
 try{return JSON.parse(localStorage.getItem(STORE_BOOKINGS)||"[]")}
 catch(e){return []}
}
function saveBooking(item){
 const all=getBookings();
 all.unshift({...item,user:currentUser?.name||"Customer",phone:currentUser?.phone||"",date:new Date().toLocaleString("en-IN")});
 localStorage.setItem(STORE_BOOKINGS,JSON.stringify(all));
}

function rideForm(){
 if(!currentUser) return showPage("rolePage");
 currentContentType="ride";
 $("contentTitle").textContent="Book Your Ride";
 $("contentIntro").innerHTML="<h3>अपनी गाड़ी चुनें</h3><p>हर गाड़ी के सामने उसी प्रकार की फोटो और प्रति किलोमीटर किराया दिया गया है।</p>";
 $("contentList").innerHTML=`
 <div class="content-card">
  <div class="field"><label>PICKUP LOCATION</label><input id="ridePickup" placeholder="Pickup location"></div>
  <div class="field"><label>DESTINATION</label><input id="rideDestination" placeholder="Where do you want to go?"></div>
  <div class="field"><label>SELECT VEHICLE</label></div>
  <div class="vehicle-grid">${vehicles.map(v=>`
   <button class="vehicle ${v.name===selectedVehicle?"selected":""}" onclick="selectVehicle('${safe(v.name)}')">
    <img src="${v.img}" alt="${safe(v.name)}" onerror="this.src='https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=600'">
    <b>${safe(v.name)}</b><small>₹${v.rate}/km</small>
   </button>`).join("")}</div>
  <button class="primary" onclick="submitRide()">FIND RIDE</button>
 </div>`;
 showPage("contentPage");
}

function selectVehicle(name){
 selectedVehicle=name;
 rideForm();
}

function submitRide(){
 const pickup=$("ridePickup").value.trim();
 const destination=$("rideDestination").value.trim();
 if(!pickup||!destination) return notify("Pickup और Destination भरें");
 const vehicle=vehicles.find(v=>v.name===selectedVehicle);
 saveBooking({type:"Ride",title:selectedVehicle,pickup,destination,rate:vehicle.rate,status:"Pending"});
 notify("Ride request सेव हो गई");
 goHome();
}

function openListing(type){
 if(!currentUser) return showPage("rolePage");
 currentContentType=type;
 const data=listings[type]||[];
 const titles={hotel:"Hotels",bus:"Bus Tickets",train:"Train Tickets",flight:"Flight Tickets",package:"Tour Packages"};
 const descriptions={
  hotel:"होटल देखें, पसंद करें और उसी जगह से बुकिंग रिक्वेस्ट भेजें।",
  bus:"बस के विकल्प देखें और अपनी यात्रा की टिकट रिक्वेस्ट भेजें।",
  train:"ट्रेन की जानकारी देखें और टिकट खोजें।",
  flight:"फ्लाइट के विकल्प देखें और टिकट की रिक्वेस्ट भेजें।",
  package:"अपनी पसंद का टूर पैकेज चुनें और बुकिंग करें।"
 };
 $("contentTitle").textContent=titles[type];
 $("contentIntro").innerHTML=`<h3>${titles[type]}</h3><p>${descriptions[type]}</p>`;
 $("contentList").innerHTML=data.map((item,index)=>`
  <article class="content-card">
   <img src="${item.img}" alt="${safe(item.name)}" style="width:100%;height:175px;object-fit:cover;border-radius:13px" onerror="this.style.display='none'">
   <h3 style="margin-top:12px">${index===0?"★ Recommended • ":""}${safe(item.name)}</h3>
   <p><i class="fa-solid fa-location-dot"></i> ${safe(item.place)}</p>
   <p>${safe(item.desc)}</p>
   <p><b>${safe(item.price)}</b></p>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
    <button class="action-btn" onclick="toggleLike('${type}-${index}')"><i class="fa-regular fa-heart"></i> <span id="like-${type}-${index}">${isLiked(type,index)?"Liked":"Like"}</span></button>
    <button class="action-btn" onclick="commentItem('${type}',${index})"><i class="fa-regular fa-comment"></i> Comment</button>
    <button class="action-btn" onclick="shareItem('${type}',${index})"><i class="fa-solid fa-share"></i> Share</button>
    <button class="action-btn" onclick="bookItem('${type}',${index})"><i class="fa-solid fa-ticket"></i> ${type==="hotel"?"Book Hotel":type==="package"?"Book Package":"Book Ticket"}</button>
   </div>
  </article>`).join("");
 showPage("contentPage");
}

function hotelForm(){openListing("hotel")}
function packageForm(){openListing("package")}
function ticketsForm(type){openListing(type||"bus")}

function isLiked(key,index){
 const likes=JSON.parse(localStorage.getItem(STORE_LIKES)||"{}");
 return !!likes[key+"-"+index];
}
function toggleLike(key){
 const likes=JSON.parse(localStorage.getItem(STORE_LIKES)||"{}");
 likes[key]=!likes[key];
 localStorage.setItem(STORE_LIKES,JSON.stringify(likes));
 notify(likes[key]?"आपने Like किया ❤️":"Like हटाया");
 const parts=key.split("-");
 const id="like-"+parts[0]+"-"+parts[1];
 if($(id)) $(id).textContent=likes[key]?"Liked":"Like";
}

function commentItem(type,index){
 const item=listings[type][index];
 $("modalTitle").textContent="Comment";
 $("modalBody").innerHTML=`
  <p style="font-size:12px;margin-bottom:12px">${safe(item.name)} पर अपना कमेंट लिखें।</p>
  <textarea id="commentText" rows="3" placeholder="अपना कमेंट लिखें..." style="width:100%;padding:12px;border:1px solid #dfe6f0;border-radius:12px"></textarea>
  <button class="primary" onclick="saveComment('${type}',${index})">POST COMMENT</button>`;
 $("modalBg").classList.add("show");
}
function saveComment(type,index){
 const text=$("commentText").value.trim();
 if(!text) return notify("कमेंट लिखें");
 const key="nv_comments_"+type+"_"+index;
 const comments=JSON.parse(localStorage.getItem(key)||"[]");
 comments.push({name:currentUser?.name||"Guest",text});
 localStorage.setItem(key,JSON.stringify(comments));
 closeModal();
 notify("Comment सेव हो गया");
}

async function shareItem(type,index){
 const item=listings[type][index];
 const text=item.name+" - NV TRAVELSS";
 if(navigator.share){
  try{await navigator.share({title:item.name,text})}
  catch(e){}
 }else{
  try{await navigator.clipboard.writeText(text);notify("Share text कॉपी हो गया")}
  catch(e){notify(text)}
 }
}

function bookItem(type,index){
 const item=listings[type][index];
 $("modalTitle").textContent="Booking Request";
 $("modalBody").innerHTML=`
  <h3>${safe(item.name)}</h3>
  <p style="font-size:11px;color:#64748b;margin:8px 0 15px">${safe(item.place)}</p>
  <div class="field"><label>YOUR NAME</label><input id="bookingName" value="${safe(currentUser?.name||"")}" placeholder="Your name"></div>
  <div class="field"><label>MOBILE NUMBER</label><input id="bookingPhone" value="${safe(currentUser?.phone||"")}" maxlength="10" placeholder="10 digit mobile"></div>
  <div class="field"><label>TRAVEL / CHECK-IN DATE</label><input id="bookingDate" type="date"></div>
  <div class="field"><label>NUMBER OF PEOPLE / ROOMS</label><input id="bookingCount" type="number" min="1" value="1"></div>
  <button class="primary" onclick="confirmListingBooking('${type}',${index})">SEND BOOKING REQUEST</button>`;
 $("modalBg").classList.add("show");
}
function confirmListingBooking(type,index){
 const name=$("bookingName").value.trim();
 const phone=$("bookingPhone").value.trim();
 const date=$("bookingDate").value;
 const count=$("bookingCount").value;
 if(!name||!/^[6-9]\d{9}$/.test(phone)||!date) return notify("सभी जानकारी सही भरें");
 saveBooking({type:type.toUpperCase(),title:listings[type][index].name,date,count,status:"Booking Request"});
 closeModal();
 notify("Booking request सेव हो गई");
}

function modal(title,html){
 $("modalTitle").textContent=title;
 $("modalBody").innerHTML=html;
 $("modalBg").classList.add("show");
}
function closeModal(){$("modalBg").classList.remove("show")}
function outsideClose(e){if(e.target===$("modalBg"))closeModal()}

function showProfile(){
 if(!currentUser)return showPage("rolePage");
 $("profileDetails").innerHTML=`
  <h3>My Profile</h3>
  <p><b>Name:</b> ${safe(currentUser.name)}</p>
  <p><b>Mobile:</b> ${safe(currentUser.phone)}</p>
  <p><b>Account:</b> ${safe(currentUser.role)}</p>
  <p><b>Service:</b> ${safe(currentUser.service||"Customer")}</p>`;
 showPage("profilePage");
}

function showSearch(){
 modal("Search NV TRAVELSS",`
  <div class="field"><label>SEARCH DESTINATION OR SERVICE</label><input id="quickSearch" placeholder="Hotel, Manali, Bus..."></div>
  <button class="primary" onclick="runQuickSearch()">SEARCH</button>`);
}
function runQuickSearch(){
 const q=$("quickSearch").value.trim().toLowerCase();
 closeModal();
 if(!q)return notify("कुछ लिखकर खोजें");
 if(q.includes("hotel"))return hotelForm();
 if(q.includes("bus"))return ticketsForm("bus");
 if(q.includes("train"))return ticketsForm("train");
 if(q.includes("flight"))return ticketsForm("flight");
 if(q.includes("package"))return packageForm();
 modal("Search Result",`<p>“${safe(q)}” के लिए खोजें। अधिक जानकारी के लिए सही विकल्प चुनें।</p>`);
}

function searchDestination(){
 const q=$("homeSearch").value.trim();
 if(!q)return notify("अपनी जगह लिखें");
 destination(q);
}
function destination(name){
 modal(name,`
  <h3>${safe(name)} यात्रा</h3>
  <p style="font-size:12px;color:#64748b;margin-top:8px">इस जगह के लिए होटल, पैकेज और यात्रा विकल्प देखें।</p>
  <button class="primary" onclick="closeModal();packageForm()">VIEW TOUR PACKAGES</button>
  <button class="primary" onclick="closeModal();hotelForm()">VIEW HOTELS</button>`);
}

function showReels(){
 $("reelsList").innerHTML=`
  <div class="content-card"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800" style="width:100%;height:220px;object-fit:cover;border-radius:14px"><h3>Explore beautiful places</h3><p>Like • Comment • Share</p></div>
  <div class="content-card"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800" style="width:100%;height:220px;object-fit:cover;border-radius:14px"><h3>Travel memories</h3><p>Like • Comment • Share</p></div>`;
 showPage("reelsPage");
}
function createPost(){
 modal("Create Post",`
  <div class="field"><label>WRITE YOUR POST</label><textarea id="postText" rows="4" placeholder="अपना अनुभव साझा करें..."></textarea></div>
  <button class="primary" onclick="savePost()">POST</button>`);
}
function savePost(){
 const text=$("postText").value.trim();
 if(!text)return notify("कुछ लिखें");
 const posts=JSON.parse(localStorage.getItem("nv_travelss_posts")||"[]");
 posts.unshift({text,user:currentUser?.name||"User",date:new Date().toLocaleString("en-IN")});
 localStorage.setItem("nv_travelss_posts",JSON.stringify(posts));
 closeModal();
 notify("आपकी Post सेव हो गई");
}

function providerService(type){
 if(type==="Driver"){
  modal("Driver Service",`
   <h3>Driver Panel</h3>
   <p>Ride requests और अपनी गाड़ी की जानकारी मैनेज करें।</p>
   <div class="field"><label>VEHICLE TYPE</label><select id="driverVehicle">${vehicles.map(v=>`<option>${safe(v.name)}</option>`).join("")}</select></div>
   <div class="field"><label>VEHICLE NUMBER</label><input id="driverNumber" placeholder="Vehicle number"></div>
   <button class="primary" onclick="saveDriverInfo()">SAVE DRIVER DETAILS</button>`);
 }else{
  modal("Hotel Owner Service",`
   <h3>अपनी होटल की जानकारी जोड़ें</h3>
   <div class="field"><label>HOTEL NAME</label><input id="providerHotelName" placeholder="Hotel name"></div>
   <div class="field"><label>HOTEL ADDRESS</label><input id="providerHotelAddress" placeholder="Hotel address"></div>
   <button class="primary" onclick="saveHotelInfo()">SAVE HOTEL DETAILS</button>`);
 }
}
function saveDriverInfo(){
 const vehicle=$("driverVehicle").value;
 const number=$("driverNumber").value.trim();
 if(!number)return notify("गाड़ी का नंबर भरें");
 localStorage.setItem("nv_driver_info",JSON.stringify({vehicle,number}));
 closeModal();notify("Driver details सेव हो गई");
}
function saveHotelInfo(){
 const name=$("providerHotelName").value.trim();
 const address=$("providerHotelAddress").value.trim();
 if(!name||!address)return notify("होटल का नाम और पता भरें");
 localStorage.setItem("nv_provider_hotel",JSON.stringify({name,address}));
 closeModal();notify("Hotel details सेव हो गई");
}
function providerBookings(){
 const all=getBookings();
 const mine=all.filter(b=>b.phone===currentUser?.phone);
 modal("My Bookings",mine.length?mine.map(b=>`
  <div class="content-card"><h3>${safe(b.title)}</h3><p>${safe(b.type)} • ${safe(b.date||"")}</p><p>Status: ${safe(b.status)}</p></div>`).join(""):"<div class='empty'>अभी कोई Booking नहीं है।</div>");
}
function providerEarnings(){
 modal("My Earnings",`
  <h3>Driver Commission: 15%</h3>
  <p>Driver Monthly Recharge: ₹300</p>
  <p>Hotel Owner Commission: 15%</p>
  <p>Hotel Owner Monthly Pass: ₹1000</p>
  <p style="margin-top:12px">कमाई और भुगतान की वास्तविक जानकारी सर्वर/एडमिन सिस्टम जुड़ने के बाद दिखाई जाएगी।</p>`);
}
function providerProfile(){showProfile()}

window.addEventListener("load",()=>{
 if(currentUser) openUserHome();
 else showPage("rolePage");
});
</script>
</div>
</body>
</html>
