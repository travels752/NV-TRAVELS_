<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NV TRAVELSS - Home</title>
    <!-- Icons के लिए FontAwesome लिंक -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* ==================== CSS डिजाइन यहाँ शुरू है ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b1528;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* मोबाइल ऐप फ्रेम */
        .app-container {
            width: 100%;
            max-width: 412px;
            height: 880px;
            background-color: #f6f9fe;
            position: relative;
            overflow-y: auto;
            border-radius: 36px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            padding-bottom: 90px;
        }

        .app-container::-webkit-scrollbar {
            display: none;
        }

        /* टॉप हेडर और बैनर */
        .hero-section {
            background: linear-gradient(180deg, #0750c7 0%, #3081f7 65%, #f6f9fe 100%);
            padding: 20px 20px 25px 20px;
            color: white;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            opacity: 0.95;
        }

        .status-icons i {
            margin-left: 6px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .logo-s {
            color: #3ee1a2;
        }

        .tagline {
            font-size: 11px;
            opacity: 0.85;
            margin-top: 2px;
        }

        .nav-right {
            display: flex;
            gap: 12px;
        }

        .icon-badge, .profile-pic {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            backdrop-filter: blur(5px);
        }

        .hero-content h1 {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 6px;
        }

        .hero-content p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 22px;
        }

        /* सर्च बार */
        .search-container {
            background: white;
            border-radius: 30px;
            padding: 6px 6px 6px 18px;
            display: flex;
            align-items: center;
            box-shadow: 0 8px 25px rgba(7, 80, 199, 0.15);
            margin-bottom: 22px;
        }

        .search-icon {
            color: #ff4d4d;
            font-size: 18px;
            margin-right: 12px;
        }

        .search-container input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 15px;
            color: #333;
        }

        .search-btn {
            background: #0066ff;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        /* कैटगरी चिप्स */
        .categories-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* मुख्य सर्विसेज ग्रिड */
        .main-content {
            padding: 0 20px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .service-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            position: relative;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 155px;
            overflow: hidden;
        }

        .card-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .blue-icon { background: #eaf2ff; color: #0066ff; }
        .orange-icon { background: #fff5eb; color: #ff8400; }
        .green-icon { background: #e6f9f0; color: #00cc66; }
        .purple-icon { background: #f4ebff; color: #8433ff; }

        .service-card h2 {
            font-size: 19px;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .service-card p {
            font-size: 12px;
            color: #64748b;
            line-height: 1.3;
        }

        .card-arrow {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 28px;
            height: 28px;
            background: #f1f5f9;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: #64748b;
        }

        /* राइड कार्ड के लिए कार इमेज की जगह स्टाइलिश शेड */
        .ride-card::after {
            content: "🚗";
            position: absolute;
            font-size: 70px;
            bottom: -10px;
            right: -10px;
            opacity: 0.8;
        }

        /* होटल कार्ड शेड */
        .hotel-card::after {
            content: "🛏️";
            position: absolute;
            font-size: 65px;
            bottom: -10px;
            right: -5px;
            opacity: 0.15;
        }

        /* सब-सर्विसेज (Packages & Tickets) */
        .sub-services-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .compact-card {
            min-height: auto;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            padding: 14px 20px;
        }

        .compact-card .card-icon {
            margin-bottom: 0;
            flex-shrink: 0;
        }

        /* पॉपुलर डेस्टिनेशन्स */
        .section-area {
            margin-bottom: 25px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-header h3 {
            font-size: 17px;
            color: #1e293b;
            font-weight: 700;
        }

        .view-all {
            font-size: 13px;
            color: #0066ff;
            text-decoration: none;
            font-weight: 600;
        }

        .horizontal-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .horizontal-scroll::-webkit-scrollbar {
            display: none;
        }

        .dest-card {
            min-width: 125px;
            height: 125px;
            border-radius: 18px;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 12px;
            background: #e2e8f0;
            box-shadow: inset 0 -40px 40px rgba(0,0,0,0.5);
        }

        /* डेस्टिनेशन डमी कलर्स (बिना इमेज एरर के दिखने के लिए) */
        .dest-1 { background: linear-gradient(to top, rgba(0,0,0,0.7), transparent), #4a90e2; }
        .dest-2 { background: linear-gradient(to top, rgba(0,0,0,0.7), transparent), #50e3c2; }
        .dest-3 { background: linear-gradient(to top, rgba(0,0,0,0.7), transparent), #b8e986; }

        .dest-card span {
            color: white;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* बॉटम नेविगेशन बार */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 78px;
            background: #ffffff;
            border-top: 1px solid #edf2f9;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 12px;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
        }

        .nav-item i {
            font-size: 22px;
            margin-bottom: 3px;
        }

        .nav-item.active {
            color: #0066ff;
        }
