<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NV TRAVELSS</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- LOGIN PAGE (Untouched as requested) -->
    <div id="login-page" class="page active-page">
        <div class="auth-container">
            <h2>NV TRAVELSS Login</h2>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Enter Username" required>
                <input type="password" id="login-password" placeholder="Enter Password" required>
                <button type="submit" class="btn-primary">Login</button>
            </form>
        </div>
    </div>

    <!-- HOME PAGE (Untouched as requested) -->
    <div id="home-page" class="page">
        <header>
            <h1>NV TRAVELSS</h1>
            <nav>
                <button onclick="switchTab('home')">Home</button>
                <button onclick="switchTab('hotels')">Hotels</button>
                <button onclick="switchTab('packages')">Packages</button>
                <button onclick="switchTab('tickets')">Tickets</button>
            </nav>
        </header>
        <main>
            <section class="hero">
                <h2>Welcome to NV Travelss</h2>
                <p>Book your rides, hotels, packages, and tickets seamlessly.</p>
            </section>
        </main>
    </div>

    <!-- HOTELS SECTION -->
    <div id="hotels-section" class="app-section">
        <div class="section-header">
            <h2>Hotels Listing</h2>
            <div class="filter-container">
                <label for="hotel-city-filter">Select City:</label>
                <select id="hotel-city-filter" onchange="filterHotels()">
                    <option value="all">All Registered Cities</option>
                </select>
            </div>
        </div>
        <div id="hotels-container" class="cards-grid"></div>
    </div>

    <!-- PACKAGES SECTION -->
    <div id="packages-section" class="app-section">
        <div class="section-header">
            <h2>Travel Packages</h2>
            <div class="filter-container">
                <label for="package-city-filter">Select City:</label>
                <select id="package-city-filter" onchange="filterPackages()">
                    <option value="all">All Destinations</option>
                </select>
            </div>
        </div>
        <div id="packages-container" class="cards-grid"></div>
    </div>

    <!-- TICKETS SECTION -->
    <div id="tickets-section" class="app-section">
        <div class="section-header">
            <h2>Tickets Booking</h2>
            <div class="filter-container">
                <label for="ticket-city-filter">Select City / Route:</label>
                <select id="ticket-city-filter" onchange="filterTickets()">
                    <option value="all">All Routes</option>
                </select>
            </div>
        </div>
        <div id="tickets-container" class="cards-grid"></div>
    </div>

    <!-- Booking Modal -->
    <div id="booking-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeBookingModal()">&times;</span>
            <h3 id="modal-title">Confirm Booking</h3>
            <form id="booking-form" onsubmit="submitBooking(event)">
                <input type="text" id="booker-name" placeholder="Your Name" required>
                <input type="tel" id="booker-phone" placeholder="Phone Number" required>
                <button type="submit" class="btn-primary">Confirm & Book Now</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
