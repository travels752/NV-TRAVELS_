<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NV TRAVELSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="hero-header">
    <div class="top-bar">
      <div class="brand">
        <div class="logo">
          <i class="fa-solid fa-paper-plane"></i>
        </div>
        <div>
          <h1>NV <span>TRAVELSS</span></h1>
          <p class="tagline">Travel • Ride • Hotel • Packages • Tickets</p>
        </div>
      </div>
      <div class="nav-icons">
        <i class="fa-regular fa-bell"></i>
        <i class="fa-regular fa-user"></i>
      </div>
    </div>
    <div class="slogan">
      आपका सफर, हमारी ज़िम्मेदारी ❤️
    </div>
  </header>

  <main class="app-content">
    <section class="search-card">
      <div class="search-info">
        <div class="search-icon">
          <i class="fa-solid fa-location-dot"></i>
        </div>
        <div>
          <h2>Where do you want to go?</h2>
          <p>नई जगहें, नए अनुभव, एक ही ऐप में!</p>
        </div>
      </div>
      <div class="search-art">
        <i class="fa-solid fa-mountain-sun"></i>
      </div>
    </section>

    <!-- Services Grid will go here -->
    <section class="services-grid">
      <!-- Service cards -->
    </section>

    <!-- Reels Banner -->
    <section class="reels-banner">
      <!-- Reels content -->
    </section>

    <!-- Contact Banner -->
    <section class="contact-banner">
      <!-- Contact content -->
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="#" class="nav-item active">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-film"></i>
      <span>Reels</span>
    </a>
    <div class="plus-btn-wrapper">
      <button class="plus-btn"><i class="fa-solid fa-plus"></i></button>
    </div>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-briefcase"></i>
      <span>Packages</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-hotel"></i>
      <span>Hotel</span>
    </a>
  </nav>

</body>
</html>
